name: Publish to PyPI

# Runs when a GitHub Release is published (tag vX.Y.Z):
#
#   1. the release tag must equal the version in pyproject.toml;
#   2. the tests run on the release's commit (tests.yml); nothing is published unless
#      they pass;
#   3. the sdist and wheel are built and uploaded with Trusted Publishing (no token).
#
# If only the upload failed, "Re-run failed jobs" retries it. If the tests failed: fix,
# delete the release and its tag, and release again from the fixed main.
#
# Keep this file's name: the PyPI trusted publisher is registered for publish.yml with
# environment pypi.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release tag equals pyproject.toml's version and __version__
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "${{ github.event.release.tag_name }}" \
            || { echo "::error::release tag ${{ github.event.release.tag_name }} != v$version (pyproject.toml)"; exit 1; }
          grep -q "^__version__ = \"$version\"" src/zarr_zip/__init__.py \
            || { echo "::error::src/zarr_zip/__init__.py __version__ is not $version"; exit 1; }

  tests:
    needs: checks
    uses: ./.github/workflows/tests.yml

  build:
    name: Build distributions
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel, check metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zarr-zip/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
