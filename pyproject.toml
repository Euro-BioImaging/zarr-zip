[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zarr-zip"
version = "0.0.1"
description = "Zarr stores in zip files: one zip per store (BioImage Archive layout or NGFF RFC-9 .ozx)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Bugra Özdemir", email = "bugraa.ozdemir@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest", "zarr>=3"]

[project.scripts]
zarr-zip = "zarr_zip.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
