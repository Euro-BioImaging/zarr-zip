[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zarr-zip"
version = "0.1.0"
description = "Zarr stores in zip files: one zip per store (BioImage Archive layout or NGFF RFC-9 .ozx)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bugra Özdemir", email = "bugraa.ozdemir@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = []

[project.optional-dependencies]
zarr = ["zarr>=3.1"]
test = ["pytest", "zarr>=3.1"]

[project.urls]
Homepage = "https://github.com/Euro-BioImaging/zarr-zip"
Issues = "https://github.com/Euro-BioImaging/zarr-zip/issues"

[project.scripts]
zarr-zip = "zarr_zip.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
